<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Charts</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<main id="page">
    <header class="charts-header"><h1>Charts</h1></header>
    <div id="chart-message"></div>
    <div id="chart-sections"></div>
    <dialog id="week-dialog" class="week-dialog" aria-labelledby="week-dialog-title">
        <div class="week-dialog-header">
            <div class="week-dialog-heading">
                <h2 id="week-dialog-title"></h2>
                <span id="week-dialog-total" class="week-dialog-total"></span>
            </div>
            <div class="week-dialog-actions">
                <button id="week-dialog-prev" type="button" class="nav-btn" title="Previous week (←)" aria-label="Previous week">&lsaquo; Prev</button>
                <button id="week-dialog-next" type="button" class="nav-btn" title="Next week (→)" aria-label="Next week">Next &rsaquo;</button>
                <button id="week-dialog-close" type="button" class="week-dialog-close" aria-label="Close">&times;</button>
            </div>
        </div>
        <p id="week-activities-empty" class="week-activities-empty" hidden>No activities this week.</p>
        <div id="week-activities" class="week-activities"></div>
    </dialog>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script id="page-data" type="application/json">{{PAGE_DATA_JSON}}</script>
<script type="module" src="./weeklymileage.ts"></script>
</body>
</html>
