<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Activity Heatmap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { height: 100%; margin: 0; display: flex; flex-direction: column; }
        #map { flex: 1 1 auto; }
        #timeline-controls {
            display: grid; grid-template-columns: auto minmax(100px, 1fr) auto auto; align-items: center;
            gap: 12px; padding: 10px 16px; background: #fff; border-top: 1px solid #d5d9dc;
            color: #24292d; font: 13px sans-serif; flex: 0 0 auto;
        }
        #timeline-controls[hidden] { display: none; }
        .timeline-button {
            min-width: 64px; height: 34px; padding: 0 10px; border: 1px solid #aeb6bc;
            border-radius: 4px; background: #f7f8f8; color: inherit; font: inherit; cursor: pointer;
        }
        .timeline-button:hover { background: #edf0f1; }
        #timeline-slider { width: 100%; min-width: 0; accent-color: #16836d; }
        #timeline-date { min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
        @media (max-width: 480px) {
            #timeline-controls { grid-template-columns: auto minmax(72px, 1fr) auto; gap: 8px; padding: 8px; }
            #timeline-date { grid-column: 1 / -1; grid-row: 2; text-align: center; }
        }
        .app-nav { display: flex; gap: 4px; padding: 8px 12px; background: #222; flex: 0 0 auto; }
        .app-nav .nav-link { color: #ddd; text-decoration: none; font: 13px sans-serif; padding: 6px 10px; border-radius: 4px; }
        .app-nav .nav-link:hover { background: #333; color: #fff; }
        .app-nav .nav-link.active { background: #3388ff; color: #fff; }
        .legend { background: white; padding: 8px 12px; font: 13px sans-serif; line-height: 1.6; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .legend .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
        .bookmark-buttons { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
        .bookmark-btn {
            font: 13px sans-serif; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px;
            background: #f7f7f7; cursor: pointer; text-align: left;
        }
        .bookmark-btn:hover { background: #ececec; }
        .bookmark-btn.active { background: #3388ff; border-color: #3388ff; color: white; }
        .home-control .home-btn {
            font: 16px sans-serif;
            line-height: 1;
            width: 34px;
            height: 30px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f7f7f7;
            cursor: pointer;
            padding: 0;
        }
        .home-control .home-btn:hover { background: #ececec; }
    </style>
</head>
<body>
{{NAV_BAR_HTML}}
<div id="map"></div>
<div id="timeline-controls" hidden>
    <button id="timeline-play" class="timeline-button" type="button" aria-label="Play timeline">Play</button>
    <input id="timeline-slider" type="range" min="0" max="0" value="0" step="1" aria-label="Activities shown over time" />
    <button id="timeline-speed" class="timeline-button" type="button" aria-label="Timeline duration">30s</button>
    <output id="timeline-date" for="timeline-slider"></output>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
    var undatedPointsByType = {{UNDATED_POINTS_BY_TYPE_JS}};
    var timelineActivities = {{TIMELINE_ACTIVITIES_JS}};

    var map = L.map('map', { zoomControl: false }).setView({{INITIAL_VIEW_JS}});
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png{{CARTO_API_QUERY}}', {
        maxZoom: 19, subdomains: 'abcd', detectRetina: true,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    var heatOptions = {
        radius: 8, blur: 10, maxZoom: 15, minOpacity: 0.3,
        gradient: { 0.2: 'blue', 0.4: 'lime', 0.6: 'orange', 0.85: 'red' }
    };

    var heatLayersByType = {};
    var allTypes = new Set(Object.keys(undatedPointsByType));
    timelineActivities.forEach(function (activity) { allTypes.add(activity.type); });
    allTypes.forEach(function (type) {
        heatLayersByType[type] = L.heatLayer([], heatOptions).addTo(map);
    });

    var timelineSlider = document.getElementById('timeline-slider');
    var timelineDate = document.getElementById('timeline-date');
    var playButton = document.getElementById('timeline-play');
    var speedButton = document.getElementById('timeline-speed');
    var timelineTimer = null;
    var speedOptions = [30000, 15000, 7500];
    var speedLabels = ['30s', '15s', '7.5s'];
    var speedIndex = 0;

    function renderTimeline() {
        var activityCount = Number(timelineSlider.value);
        var pointsByType = {};
        Object.keys(undatedPointsByType).forEach(function (type) {
            pointsByType[type] = undatedPointsByType[type].slice();
        });
        for (var i = 0; i < activityCount; i++) {
            var activity = timelineActivities[i];
            if (!pointsByType[activity.type]) pointsByType[activity.type] = [];
            pointsByType[activity.type].push.apply(pointsByType[activity.type], activity.points);
        }
        Object.keys(heatLayersByType).forEach(function (type) {
            heatLayersByType[type].setLatLngs(pointsByType[type] || []);
        });
        timelineDate.textContent = activityCount === 0
            ? 'Before first activity'
            : timelineActivities[activityCount - 1].date + ' · ' + activityCount + ' / ' + timelineActivities.length;
    }

    function stopPlayback() {
        if (timelineTimer !== null) window.clearInterval(timelineTimer);
        timelineTimer = null;
        playButton.textContent = 'Play';
        playButton.setAttribute('aria-label', 'Play timeline');
    }

    function startPlayback() {
        if (Number(timelineSlider.value) >= timelineActivities.length) {
            timelineSlider.value = '0';
            renderTimeline();
        }
        playButton.textContent = 'Pause';
        playButton.setAttribute('aria-label', 'Pause timeline');
        timelineTimer = window.setInterval(function () {
            var next = Number(timelineSlider.value) + 1;
            timelineSlider.value = String(next);
            renderTimeline();
            if (next >= timelineActivities.length) stopPlayback();
        }, Math.max(1, speedOptions[speedIndex] / timelineActivities.length));
    }

    timelineSlider.max = String(timelineActivities.length);
    if (timelineActivities.length > 0) {
        document.getElementById('timeline-controls').hidden = false;
        renderTimeline();
        timelineSlider.addEventListener('input', renderTimeline);
        playButton.addEventListener('click', function () {
            if (timelineTimer === null) startPlayback(); else stopPlayback();
        });
        speedButton.addEventListener('click', function () {
            speedIndex = (speedIndex + 1) % speedOptions.length;
            speedButton.textContent = speedLabels[speedIndex];
            speedButton.setAttribute('aria-label', 'Timeline duration ' + speedLabels[speedIndex]);
            if (timelineTimer !== null) {
                stopPlayback();
                startPlayback();
            }
        });
    } else {
        renderTimeline();
    }

    window.onActivityTypeToggle = function (type, checked) {
        var layer = heatLayersByType[type];
        if (!layer) return;
        if (checked) map.addLayer(layer); else map.removeLayer(layer);
    };

    {{BOOKMARK_CONTROL_SCRIPT}}
    {{ACTIVITY_TYPE_CONTROL_SCRIPT}}
    {{HOME_CONTROL_SCRIPT}}
</script>
</body>
</html>
