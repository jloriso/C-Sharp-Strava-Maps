<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Route Line Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { height: 100%; margin: 0; display: flex; flex-direction: column; }
        #map { flex: 1 1 auto; }
        #timeline-controls {
            display: grid; grid-template-columns: auto auto minmax(100px, 1fr) auto auto auto auto; align-items: center;
            gap: 8px; padding: 8px 12px; background: #fff; border-top: 1px solid #d5d9dc;
            color: #24292d; font: 13px sans-serif; flex: 0 0 auto;
        }
        #timeline-controls[hidden] { display: none; }
        .timeline-button {
            min-width: 64px; height: 30px; padding: 0 10px; border: 1px solid #aeb6bc;
            border-radius: 4px; background: #f7f8f8; color: inherit; font: inherit; cursor: pointer;
        }
        .timeline-button:hover { background: #edf0f1; }
        .timeline-button:disabled { opacity: 0.4; cursor: default; }
        #timeline-slider { width: 100%; min-width: 0; accent-color: #16836d; }
        #timeline-date { min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
        .map-type-buttons { display: flex; gap: 4px; }
        .map-type-btn { height: 30px; padding: 0 9px; border: 1px solid #ccc; border-radius: 3px; background: #f7f7f7; color: #24292d; font: 13px sans-serif; cursor: pointer; white-space: nowrap; }
        .map-type-btn.active { background: #3388ff; border-color: #3388ff; color: #fff; }
        .map-type-btn:hover:not(.active) { background: #ececec; }
        .leaflet-top.leaflet-left .map-type-control { clear: none; margin-top: 10px; margin-left: 4px; }
        @media (max-width: 480px) {
            #timeline-controls { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 8px; }
            #timeline-start { grid-column: 1; grid-row: 1; }
            #timeline-older { grid-column: 2; grid-row: 1; }
            #timeline-slider { grid-column: 1 / -1; grid-row: 2; }
            #timeline-newer { grid-column: 3; grid-row: 1; }
            #timeline-latest { grid-column: 4; grid-row: 1; }
            #timeline-date { grid-column: 1 / 4; text-align: left; min-width: 0; }
            #timeline-year { grid-column: 4; text-align: right; }
        }
        .legend { background: white; padding: 8px 12px; font: 13px sans-serif; line-height: 1.6; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .legend .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
        .bookmark-buttons { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
        .bookmark-btn {
            font: 13px sans-serif; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px;
            background: #f7f7f7; cursor: pointer; text-align: left;
        }
        .bookmark-btn:hover { background: #ececec; }
        .bookmark-btn.active { background: #3388ff; border-color: #3388ff; color: white; }
        .home-control .home-btn {
            font: 16px sans-serif;
            line-height: 1;
            width: 34px;
            height: 30px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f7f7f7;
            cursor: pointer;
            padding: 0;
        }
        .home-control .home-btn:hover { background: #ececec; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="timeline-controls" hidden>
    <button id="timeline-start" class="timeline-button" type="button">Start</button>
    <button id="timeline-older" class="timeline-button" type="button">Older</button>
    <input type="range" id="timeline-slider" min="0" max="0" value="0" step="1" aria-label="Activities shown over time" />
    <button id="timeline-newer" class="timeline-button" type="button">Newer</button>
    <button id="timeline-latest" class="timeline-button" type="button">Latest</button>
    <output id="timeline-date" for="timeline-slider"></output>
    <output id="timeline-year" for="timeline-slider"></output>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    var lineDataByType = {{LINE_DATA_BY_TYPE_JS}};
    var undatedActivities = {{UNDATED_ACTIVITIES_JS}};
    var timelineActivities = {{TIMELINE_ACTIVITIES_JS}};
    var typeColors = {{TYPE_COLORS_JS}};
    var map = L.map('map', { zoomControl: false }).setView({{INITIAL_VIEW_JS}});
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    
    var sharedRenderer = L.canvas({ padding: 0.5 });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png{{CARTO_API_QUERY}}', {
        maxZoom: 19, subdomains: 'abcd', detectRetina: true,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    var lineLayersByType = {};
    var visibleTypes = {};
    Object.keys(typeColors).forEach(function (type) { visibleTypes[type] = true; });
    var hasTimeline = timelineActivities.length > 0;

    function addStaticLineLayers() {
        Object.keys(lineDataByType).forEach(function (type) {
            var color = typeColors[type] || '#000000';
            var layer = L.geoJSON(lineDataByType[type], {
                renderer: sharedRenderer,
                style: function (feature) {
                    return {
                        color: color,
                        weight: feature.properties.weight,
                        opacity: feature.properties.opacity,
                        lineCap: 'round',
                        smoothFactor: 1.5
                    };
                }
            }).addTo(map);

            layer.on('click', function (e) {
                var props = e.layer.feature.properties;
                var times = props.minCount === props.maxCount
                    ? ('traveled ' + props.minCount + ' time' + (props.minCount === 1 ? '' : 's'))
                    : ('traveled ' + props.minCount + '-' + props.maxCount + ' times');
                e.layer.bindPopup(type + ' &middot; ' + times).openPopup(e.latlng);
            });

            lineLayersByType[type] = layer;
        });
    }

    function syncActivityLayer(activity) {
        var bounds = L.latLngBounds(
            [activity.bounds[0], activity.bounds[1]],
            [activity.bounds[2], activity.bounds[3]]);
        var shouldShow = visibleTypes[activity.type] && bounds.intersects(map.getBounds());

        if (shouldShow && !activity.layer) {
            activity.layer = L.polyline(activity.segments, {
                renderer: sharedRenderer,
                color: typeColors[activity.type] || '#000000',
                weight: 2,
                opacity: 0.62,
                lineCap: 'round',
                smoothFactor: 1.5
            });
            activity.layer.on('click', function (e) {
                activity.layer.bindPopup(activity.type + ' &middot; ' + (activity.date || 'Undated')).openPopup(e.latlng);
            });
        }

        if (!activity.layer) return;
        if (shouldShow && !map.hasLayer(activity.layer)) map.addLayer(activity.layer);
        else if (!shouldShow && map.hasLayer(activity.layer)) map.removeLayer(activity.layer);
    }

    var visibleActivityCount = 0;
    if (!hasTimeline) {
        addStaticLineLayers();
    } else {
        undatedActivities.forEach(syncActivityLayer);
        map.on('moveend', function () {
            undatedActivities.forEach(syncActivityLayer);
            for (var i = 0; i < visibleActivityCount; i++) syncActivityLayer(timelineActivities[i]);
        });
    }

    function renderTimeline(count) {
        if (count < visibleActivityCount) {
            for (var i = count; i < visibleActivityCount; i++) {
                var activity = timelineActivities[i];
                if (activity.layer && map.hasLayer(activity.layer)) map.removeLayer(activity.layer);
            }
        } else {
            for (var i = visibleActivityCount; i < count; i++) syncActivityLayer(timelineActivities[i]);
        }
        visibleActivityCount = count;
    }

    window.onActivityTypeToggle = function (type, checked) {
        visibleTypes[type] = checked;
        if (hasTimeline) {
            undatedActivities.forEach(syncActivityLayer);
            for (var i = 0; i < visibleActivityCount; i++) syncActivityLayer(timelineActivities[i]);
        } else {
            var layer = lineLayersByType[type];
            if (!layer) return;
            if (checked) map.addLayer(layer); else map.removeLayer(layer);
        }
    };

    {{BOOKMARK_CONTROL_SCRIPT}}
    {{ACTIVITY_TYPE_CONTROL_SCRIPT}}
    {{HOME_CONTROL_SCRIPT}}
    window.onTimelineChange = renderTimeline;
    {{MAP_TYPE_CONTROL_SCRIPT}}
    {{TIMELINE_CONTROL_SCRIPT}}
</script>
</body>
</html>
