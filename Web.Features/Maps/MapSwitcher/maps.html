<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maps</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; display: flex; flex-direction: column; font: 14px sans-serif; }
        #map-stage { position: relative; min-height: 0; flex: 1 1 auto; }
        #map-frame { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
<div id="map-stage">
    <iframe id="map-frame" title="Heatmap" data-heatmap="{{HEATMAP_HREF}}" data-linemap="{{LINEMAP_HREF}}"></iframe>
</div>
<script>
    var mapFrame = document.getElementById('map-frame');
    var mapUrls = {
        heatmap: mapFrame.getAttribute('data-heatmap'),
        linemap: mapFrame.getAttribute('data-linemap')
    };
    var currentTimelineCount = 0;
    var currentMapCenter = null;
    var currentMapZoom = null;
    mapFrame.addEventListener('load', function () {
        mapFrame.contentWindow.postMessage({
            type: 'gpxworldmap-set-map-state',
            count: currentTimelineCount,
            center: currentMapCenter,
            zoom: currentMapZoom
        }, window.location.origin);
    });
    window.addEventListener('message', function (event) {
        if (event.source !== mapFrame.contentWindow || event.origin !== window.location.origin) return;
        if (!event.data) return;
        if (event.data.type === 'gpxworldmap-timeline-position') {
            currentTimelineCount = Math.max(0, Number(event.data.count) || 0);
            return;
        }
        if (event.data.type === 'gpxworldmap-switch-map') {
            var target = event.data.map;
            if (!Object.prototype.hasOwnProperty.call(mapUrls, target)) return;
            currentTimelineCount = Math.max(0, Number(event.data.count) || 0);
            if (event.data.center && Number.isFinite(event.data.center.lat) && Number.isFinite(event.data.center.lng)) {
                currentMapCenter = { lat: event.data.center.lat, lng: event.data.center.lng };
            }
            if (Number.isFinite(Number(event.data.zoom))) currentMapZoom = Number(event.data.zoom);
            mapFrame.title = target === 'heatmap' ? 'Heatmap' : 'Line Map';
            mapFrame.src = mapUrls[target];
        }
    });
    mapFrame.src = mapUrls.heatmap;
</script>
</body>
</html>
