<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Route Line Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; }
        .legend { background: white; padding: 8px 12px; font: 13px sans-serif; line-height: 1.6; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .legend .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
        .bookmark-buttons { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
        .bookmark-btn {
            font: 13px sans-serif; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px;
            background: #f7f7f7; cursor: pointer; text-align: left;
        }
        .bookmark-btn:hover { background: #ececec; }
        .bookmark-btn.active { background: #3388ff; border-color: #3388ff; color: white; }
        .home-control .home-btn {
            font: 16px sans-serif;
            line-height: 1;
            width: 34px;
            height: 30px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f7f7f7;
            cursor: pointer;
            padding: 0;
        }
        .home-control .home-btn:hover { background: #ececec; }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // One GeoJSON FeatureCollection of frequency-scored route lines per activity
    // type -- built server-side by RouteFrequencyMapBuilder, which now merges
    // consecutive same-tier edges into long polylines wherever the route doesn't
    // branch, so this is a much smaller number of longer lines rather than tens of
    // thousands of tiny 2-point segments.
    var lineDataByType = {{LINE_DATA_BY_TYPE_JS}};
    var typeColors = {{TYPE_COLORS_JS}};

    var map = L.map('map', { zoomControl: false }).setView({{INITIAL_VIEW_JS}});
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Share one canvas renderer across every type's layer instead of each L.geoJSON
    // call creating its own -- fewer canvas contexts for the browser to composite
    // on every pan/zoom.
    var sharedRenderer = L.canvas({ padding: 0.5 });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, subdomains: 'abcd', detectRetina: true,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    // One layer per activity type, all shown by default; the checkboxes below
    // toggle each one independently.
    var lineLayersByType = {};
    Object.keys(lineDataByType).forEach(function (type) {
        var color = typeColors[type] || '#000000';
        var layer = L.geoJSON(lineDataByType[type], {
            renderer: sharedRenderer,
            style: function (feature) {
                return {
                    color: color,
                    weight: feature.properties.weight,
                    opacity: feature.properties.opacity,
                    lineCap: 'round',
                    // Now that lines are long merged polylines rather than 2-point edges,
                    // smoothFactor lets Leaflet simplify each one's vertex count per zoom
                    // level -- cheap extra headroom on top of the feature-count reduction.
                    smoothFactor: 1.5
                };
            }
        }).addTo(map);

        // A single delegated click handler per layer, instead of calling
        // .bindPopup() on every individual feature up front. With many thousands of
        // route segments, pre-building that many popups at layer-construction time
        // was itself a meaningful chunk of page-load cost; this builds popup content
        // only the moment a route is actually clicked. e.layer is the specific
        // sub-layer (polyline) that was clicked -- a standard Leaflet GeoJSON pattern.
        layer.on('click', function (e) {
            var props = e.layer.feature.properties;
            var times = props.minCount === props.maxCount
                ? ('traveled ' + props.minCount + ' time' + (props.minCount === 1 ? '' : 's'))
                : ('traveled ' + props.minCount + '-' + props.maxCount + ' times');
            e.layer.bindPopup(type + ' &middot; ' + times).openPopup(e.latlng);
        });

        lineLayersByType[type] = layer;
    });

    window.onActivityTypeToggle = function (type, checked) {
        var layer = lineLayersByType[type];
        if (!layer) return;
        if (checked) map.addLayer(layer); else map.removeLayer(layer);
    };

    {{BOOKMARK_CONTROL_SCRIPT}}
    {{ACTIVITY_TYPE_CONTROL_SCRIPT}}
    {{HOME_CONTROL_SCRIPT}}
</script>
</body>
</html>
