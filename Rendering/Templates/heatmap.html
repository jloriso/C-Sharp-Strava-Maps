<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Activity Heatmap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map { height: 100%; margin: 0; }
        .legend { background: white; padding: 8px 12px; font: 13px sans-serif; line-height: 1.6; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .legend .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
        .bookmark-buttons { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
        .bookmark-btn {
            font: 13px sans-serif; padding: 4px 10px; border: 1px solid #ccc; border-radius: 4px;
            background: #f7f7f7; cursor: pointer; text-align: left;
        }
        .bookmark-btn:hover { background: #ececec; }
        .bookmark-btn.active { background: #3388ff; border-color: #3388ff; color: white; }
        .home-control .home-btn {
            font: 16px sans-serif;
            line-height: 1;
            width: 34px;
            height: 30px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f7f7f7;
            cursor: pointer;
            padding: 0;
        }
        .home-control .home-btn:hover { background: #ececec; }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
    // Weighted [lat, lon, weight] points per activity type -- built server-side by
    // rounding every recorded GPS point to a fixed precision and counting repeats,
    // so frequently-visited spots show up hotter.
    var pointsByType = {{POINTS_BY_TYPE_JS}};

    var map = L.map('map', { zoomControl: false }).setView({{INITIAL_VIEW_JS}});
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, subdomains: 'abcd', detectRetina: true,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    var heatOptions = {
        radius: 10,
        blur: 14,
        maxZoom: 15,
        minOpacity: 0.12,
        // Cooler low frequency, warm mids, dark hot spots.
        gradient: {
            0.05: '#1e3a8a', // deep cool blue
            0.20: '#2563eb', // blue
            0.40: '#06b6d4', // cyan
            0.60: '#fde047', // yellow
            0.78: '#f97316', // orange
            0.90: '#dc2626', // red
            1.00: '#4a0404'  // dark red for highest frequency
        }
    };

    // One heat layer per activity type, all shown by default; the checkboxes below
    // toggle each one independently.
    var heatLayersByType = {};
    Object.keys(pointsByType).forEach(function (type) {
        heatLayersByType[type] = L.heatLayer(pointsByType[type], heatOptions).addTo(map);
    });

    window.onActivityTypeToggle = function (type, checked) {
        var layer = heatLayersByType[type];
        if (!layer) return;
        if (checked) map.addLayer(layer); else map.removeLayer(layer);
    };

    {{BOOKMARK_CONTROL_SCRIPT}}
    {{ACTIVITY_TYPE_CONTROL_SCRIPT}}
    {{HOME_CONTROL_SCRIPT}}
</script>
</body>
</html>
